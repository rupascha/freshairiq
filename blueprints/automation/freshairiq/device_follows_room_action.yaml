blueprint:
  name: FreshAirIQ – Lüfter folgt der Raum-Empfehlung
  description: >-
    Schaltet ein Gerät (z. B. den Lüfter im Bad, einen Entfeuchter oder einen
    Schalter) ein, solange FreshAirIQ für den Raum „Lüften“ empfiehlt, und wieder
    aus, sobald die Empfehlung endet. Ohne Blueprint geht es auch direkt in FreshAirIQ: Raum bearbeiten →
    „Automatische Steuerung“. Bitte nicht beides gleichzeitig nutzen.
  domain: automation
  source_url: https://github.com/rupascha/freshairiq/blob/main/blueprints/automation/freshairiq/device_follows_room_action.yaml
  input:
    room:
      name: Raum
      description: Der FreshAirIQ-Sensor „Aktion“ des Raums (z. B. „Badezimmer Aktion“).
      selector:
        entity:
          integration: freshairiq
          domain: sensor
    basis:
      name: Grundlage
      description: >-
        „Hausentscheidung“ folgt der Empfehlung, die auch die Karte zeigt
        (berücksichtigt alle gleichzeitig gelüfteten Räume, z. B. „Weiter lüften“,
        solange das Haus noch lüftet). „Raumlokal“ folgt nur dem, was für diesen
        Raum allein sinnvoll wäre, und reagiert dadurch früher.
      default: room
      selector:
        select:
          options:
            - { label: "Hausentscheidung (wie in der Karte)", value: house }
            - { label: "Raumlokal (nur dieser Raum)", value: room }
    device:
      name: Gerät
      selector:
        entity:
          domain: [switch, fan, humidifier, input_boolean, light]
    on_actions:
      name: Einschalten bei
      default: [ventilate, continue_ventilating]
      selector:
        select:
          multiple: true
          options:
            - { label: "Lüften", value: ventilate }
            - { label: "Weiterlüften", value: continue_ventilating }
            - { label: "Zum Kühlen lüften", value: ventilate_for_cooling }
    only_when_windows_closed:
      name: Nicht einschalten, wenn das Fenster offen ist
      default: true
      selector: { boolean: {} }
mode: restart
triggers:
  - trigger: event
    event_type: freshairiq_room_action
    id: room
  - trigger: event
    event_type: freshairiq_room_recommendation
    id: house
  # 0.26.5.4: after a restart of Home Assistant the device is brought in line with the
  # current recommendation once (events only report changes)
  - trigger: homeassistant
    event: start
    id: start
  # also after "reload automations" (timers and waits of running automations are lost then as well)
  - trigger: event
    event_type: automation_reloaded
    id: start
variables:
  basis: !input basis
  room: !input room
  room_key: "{{ state_attr(room, 'freshairiq_room_key') }}"
  on_actions: !input on_actions
  only_when_windows_closed: !input only_when_windows_closed
  data: "{{ trigger.event.data if trigger.id != 'start' else {} }}"
  # House decision: effective recommendation (as on the card); room only: raw room action.
  action_code: "{{ data.recommendation if trigger.id == 'house' else data.action }}"
conditions:
  - "{{ trigger.id in [basis, 'start'] }}"
  # the start sync waits for the room sensor first (it may not exist yet right after the start)
  - "{{ trigger.id == 'start' or (room_key is not none and data.room_key == room_key) }}"
actions:
  - if:
      - "{{ trigger.id == 'start' }}"
    then:
      # wait until FreshAirIQ has its first result after the start
      - wait_template: "{{ states(room) not in ['unknown', 'unavailable'] and state_attr(room, 'freshairiq_room_key') is not none and state_attr(room, 'freshairiq_room_payload') is not none }}"
        timeout: "00:05:00"
        continue_on_timeout: false
      - variables:
          payload: "{{ state_attr(room, 'freshairiq_room_payload') }}"
          action_code: "{{ payload.house_aligned_action if basis == 'house' else states(room) }}"
          data: "{{ {'ventilation_active': payload.active | default(false)} }}"
  - if:
      - "{{ action_code in on_actions and not (only_when_windows_closed and data.ventilation_active) }}"
    then:
      - action: homeassistant.turn_on
        target:
          entity_id: !input device
    else:
      - action: homeassistant.turn_off
        target:
          entity_id: !input device
