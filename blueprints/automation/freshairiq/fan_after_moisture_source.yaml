blueprint:
  name: FreshAirIQ – Lüfter nach Feuchtequelle (z. B. Duschen)
  description: >-
    Schaltet ein Gerät (z. B. den Badlüfter) ein, sobald FreshAirIQ in einem Raum
    eine innere Feuchtequelle erkennt (Dusche, Bad, Kochen …), und schaltet es
    nach einer Nachlaufzeit wieder aus, wenn die Quelle beendet ist. Die
    allgemeinen Lüftungsempfehlungen (z. B. die Vorlüftung am Abend) lösen diesen
    Blueprint nicht aus. Ohne Blueprint geht es auch direkt in FreshAirIQ: Raum bearbeiten →
    „Automatische Steuerung“. Bitte nicht beides gleichzeitig nutzen.
  domain: automation
  source_url: https://github.com/rupascha/freshairiq/blob/main/blueprints/automation/freshairiq/fan_after_moisture_source.yaml
  input:
    moisture_source:
      name: Feuchtequelle
      description: Der FreshAirIQ-Sensor „Feuchtequelle aktiv“ des Raums (z. B. „Badezimmer Feuchtequelle aktiv“).
      selector:
        entity:
          integration: freshairiq
          domain: binary_sensor
    device:
      name: Gerät
      selector:
        entity:
          domain: [switch, fan, humidifier, input_boolean, light]
    sources:
      name: Nur bei diesen Quellen
      description: >-
        Leer lassen = bei jeder erkannten Feuchtequelle. Wird eine Quelle nicht
        eindeutig erkannt, gilt sie als „Feuchtequelle (unbestimmt)“.
      default: []
      selector:
        select:
          multiple: true
          options:
            - { label: "Dusche", value: shower }
            - { label: "Bad", value: bath }
            - { label: "Sauna", value: sauna }
            - { label: "Kochen", value: cooking }
            - { label: "Waschmaschine", value: washing_machine }
            - { label: "Trockner", value: dryer }
            - { label: "Bügelstation", value: ironing_station }
            - { label: "Wäsche trocknen", value: laundry_drying }
            - { label: "Feuchtequelle (unbestimmt)", value: unknown }
    follow_up:
      name: Nachlaufzeit
      description: So lange läuft das Gerät weiter, nachdem die Feuchtequelle beendet ist.
      default: 10
      selector:
        number: { min: 0, max: 60, unit_of_measurement: min, mode: slider }
    max_runtime:
      name: Höchstlaufzeit
      description: Spätestens nach dieser Zeit wird das Gerät ausgeschaltet.
      default: 60
      selector:
        number: { min: 5, max: 240, unit_of_measurement: min, mode: slider }
mode: restart
triggers:
  - trigger: state
    entity_id: !input moisture_source
    to: "on"
    id: start
  - trigger: state
    entity_id: !input moisture_source
    to: "off"
    for:
      minutes: !input follow_up
    id: stop
  # 0.26.5.4: a moisture source that is already running when Home Assistant starts
  # is followed as well (the state triggers above only see changes)
  - trigger: homeassistant
    event: start
    id: boot
  - trigger: event
    event_type: automation_reloaded
    id: boot
variables:
  sources: !input sources
  moisture_source: !input moisture_source
  source: "{{ state_attr(moisture_source, 'source') or 'unknown' }}"
  follow_up: !input follow_up
  max_runtime: !input max_runtime
  device: !input device
  # minutes since the last moisture source ended (None when unknown)
  ended_min: >-
    {% set ended = state_attr(moisture_source, 'last_ended_at') %}
    {{ ((as_timestamp(now()) - as_timestamp(ended)) / 60) | round(1) if ended else none }}
actions:
  - choose:
      - conditions:
          - "{{ (trigger.id == 'start' or (trigger.id == 'boot' and is_state(moisture_source, 'on'))) and (sources | length == 0 or source in sources) }}"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input device
          - wait_for_trigger:
              - trigger: state
                entity_id: !input moisture_source
                to: "off"
                for:
                  minutes: "{{ follow_up }}"
            timeout:
              minutes: "{{ max_runtime }}"
          - action: homeassistant.turn_off
            target:
              entity_id: !input device
      - conditions:
          # 0.26.5.4: Home Assistant restarted (or automations were reloaded) during the follow-up time: the
          # running timer is lost then. Only a follow-up that demonstrably ran is finished: the source
          # reports a valid "off" and ended (last_ended_at, kept by FreshAirIQ over a restart) less than
          # the follow-up time plus 10 minutes ago. A fan that runs without such a source (e.g. switched on
          # by hand) is left alone; with a source filter the ended source must be known and selected.
          - "{{ trigger.id == 'boot' and is_state(moisture_source, 'off') and is_state(device, 'on') and ended_min is not none and ended_min < follow_up + 10 and (sources | length == 0 or source in sources) }}"
        sequence:
          - delay:
              seconds: "{{ [((follow_up - ended_min) * 60) | int, 0] | max }}"
          - condition: state
            entity_id: !input moisture_source
            state: "off"
          - action: homeassistant.turn_off
            target:
              entity_id: !input device
      - conditions:
          - "{{ trigger.id == 'stop' }}"
        sequence:
          # Also covers a restart of Home Assistant while the device was running.
          - action: homeassistant.turn_off
            target:
              entity_id: !input device
