blueprint:
  name: FreshAirIQ – Fan follows the room recommendation
  description: >-
    Turns a device on (e.g. the bathroom exhaust fan, a dehumidifier or a
    switch) while FreshAirIQ recommends airing the room, and turns it off again
    as soon as the recommendation ends. Without a blueprint, FreshAirIQ can also do this itself: edit the room →
    "Automatic control". Please do not use both at the same time.
  domain: automation
  source_url: https://github.com/rupascha/freshairiq/blob/main/blueprints/automation/freshairiq/device_follows_room_action_en.yaml
  input:
    room:
      name: Room
      description: The room's FreshAirIQ "Action" sensor (e.g. "Bathroom Action").
      selector:
        entity:
          integration: freshairiq
          domain: sensor
    basis:
      name: Basis
      description: >-
        "House decision" follows the recommendation the card shows (it takes all
        rooms aired at the same time into account, e.g. "Keep airing" while the
        house is still airing). "Room only" follows what would be right for this
        room alone and therefore reacts earlier.
      default: room
      selector:
        select:
          options:
            - { label: "House decision (as shown on the card)", value: house }
            - { label: "Room only (this room alone)", value: room }
    device:
      name: Device
      selector:
        entity:
          domain: [switch, fan, humidifier, input_boolean, light]
    on_actions:
      name: Turn on for
      default: [ventilate, continue_ventilating]
      selector:
        select:
          multiple: true
          options:
            - { label: "Air the room", value: ventilate }
            - { label: "Keep airing", value: continue_ventilating }
            - { label: "Air for cooling", value: ventilate_for_cooling }
    only_when_windows_closed:
      name: Don't turn on while the window is open
      default: true
      selector: { boolean: {} }
mode: restart
triggers:
  - trigger: event
    event_type: freshairiq_room_action
    id: room
  - trigger: event
    event_type: freshairiq_room_recommendation
    id: house
  # 0.26.5.4: after a restart of Home Assistant the device is brought in line with the
  # current recommendation once (events only report changes)
  - trigger: homeassistant
    event: start
    id: start
  # also after "reload automations" (timers and waits of running automations are lost then as well)
  - trigger: event
    event_type: automation_reloaded
    id: start
variables:
  basis: !input basis
  room: !input room
  room_key: "{{ state_attr(room, 'freshairiq_room_key') }}"
  on_actions: !input on_actions
  only_when_windows_closed: !input only_when_windows_closed
  data: "{{ trigger.event.data if trigger.id != 'start' else {} }}"
  # House decision: effective recommendation (as on the card); room only: raw room action.
  action_code: "{{ data.recommendation if trigger.id == 'house' else data.action }}"
conditions:
  - "{{ trigger.id in [basis, 'start'] }}"
  # the start sync waits for the room sensor first (it may not exist yet right after the start)
  - "{{ trigger.id == 'start' or (room_key is not none and data.room_key == room_key) }}"
actions:
  - if:
      - "{{ trigger.id == 'start' }}"
    then:
      # wait until FreshAirIQ has its first result after the start
      - wait_template: "{{ states(room) not in ['unknown', 'unavailable'] and state_attr(room, 'freshairiq_room_key') is not none and state_attr(room, 'freshairiq_room_payload') is not none }}"
        timeout: "00:05:00"
        continue_on_timeout: false
      - variables:
          payload: "{{ state_attr(room, 'freshairiq_room_payload') }}"
          action_code: "{{ payload.house_aligned_action if basis == 'house' else states(room) }}"
          data: "{{ {'ventilation_active': payload.active | default(false)} }}"
  - if:
      - "{{ action_code in on_actions and not (only_when_windows_closed and data.ventilation_active) }}"
    then:
      - action: homeassistant.turn_on
        target:
          entity_id: !input device
    else:
      - action: homeassistant.turn_off
        target:
          entity_id: !input device
