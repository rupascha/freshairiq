# Release download statistics from GitHub's own release data (download_count of each release
# asset) and the hacs.json of each tag. Read-only: no telemetry, nothing is sent anywhere, nothing
# is committed. freshairiq.zip counts Marketplace/HACS installs of releases that install from it plus
# manual and repeated downloads; releases installed from the source archive are shown as not counted.
name: Download statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions: {}

jobs:
  downloads:
    if: github.repository == 'rupascha/freshairiq'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Downloads per release and in total
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/release_downloads.py --repository "${{ github.repository }}" --json > release-downloads.json
          python -c "import json, sys; sys.path.insert(0, 'tools'); import release_downloads as rd; print(rd.markdown(json.load(open('release-downloads.json'))))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-downloads
          path: release-downloads.json
